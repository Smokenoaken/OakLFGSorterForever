name: Manual marketplace upload (API fallback)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to upload (only if webhook delivery failed)
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
    steps:
      - name: Require upload credentials
        run: |
          if [[ -z "$CF_API_TOKEN" || -z "$WAGO_API_TOKEN" ]]; then
            echo "::error::This optional fallback requires CF_API_TOKEN and WAGO_API_TOKEN. Normal releases use repository webhooks."
            exit 1
          fi

      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Publish package
        uses: BigWigsMods/packager@v2
        env:
          CF_API_TOKEN: ${{ env.CF_API_TOKEN }}
          WAGO_API_TOKEN: ${{ env.WAGO_API_TOKEN }}
