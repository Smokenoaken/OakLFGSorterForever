name: Publish to CurseForge and Wago

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish package
        uses: BigWigsMods/packager@v2
        env:
          CF_API_TOKEN: ${{ env.CF_API_TOKEN }}
          WAGO_API_TOKEN: ${{ env.WAGO_API_TOKEN }}

      - name: Report missing marketplace secrets
        if: ${{ env.CF_API_TOKEN == '' || env.WAGO_API_TOKEN == '' }}
        run: |
          if [[ -z "$CF_API_TOKEN" ]]; then
            echo "::warning::CF_API_TOKEN is not configured; CurseForge publication was skipped."
          fi
          if [[ -z "$WAGO_API_TOKEN" ]]; then
            echo "::warning::WAGO_API_TOKEN is not configured; Wago publication was skipped."
          fi
